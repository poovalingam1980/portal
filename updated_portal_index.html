<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEOSVG Portal - Secure Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">CEOSVG Portal</h1>
            <p class="text-sm text-gray-500 mt-1">பாதுகாப்பான OTP சரிபார்ப்பு முறை</p>
        </div>

        <form id="verificationForm" class="space-y-6">
            <!-- WhatsApp OTP Section -->
            <div>
                <label for="whatsappOtp" class="block text-sm font-medium text-gray-700 mb-2">WhatsApp OTP</label>
                <input type="text" id="whatsappOtp" maxlength="6" placeholder="WhatsApp-ல் பெறப்பட்ட 6 இலக்க எண்களை உள்ளிடவும்" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-center tracking-widest text-lg font-semibold" required>
            </div>

            <!-- Email OTP Section -->
            <div>
                <label for="emailOtp" class="block text-sm font-medium text-gray-700 mb-2">Email OTP</label>
                <input type="text" id="emailOtp" maxlength="6" placeholder="மின்னஞ்சலில் பெறப்பட்ட 6 இலக்க எண்களை உள்ளிடவும்" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-center tracking-widest text-lg font-semibold" required>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg transition duration-200 shadow-md">
                OTP ஐ சரிபார்க்கவும்
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-xs text-gray-400">குறியீடுகள் திரையில் மறைக்கப்பட்டு முழுமையான பாதுகாப்போடு கையாளப்படுகின்றன.</p>
        </div>
    </div>

    <script>
        document.getElementById('verificationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const waOtp = document.getElementById('whatsappOtp').value;
            const emOtp = document.getElementById('emailOtp').value;

            if(waOtp.length === 6 && emOtp.length === 6) {
                alert('OTP வெற்றிகரமாகச் சரிபார்க்கப்பட்டது!');
            } else {
                alert('தயவுசெய்து சரியான 6 இலக்க OTP எண்களை உள்ளிடவும்.');
            }
        });
    </script>
</body>
</html>
